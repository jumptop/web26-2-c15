<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>02_css_organization</title>
    <style>
        h1 {
            color: green;
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>css를 html에서 사용하는 방법</h1>
    <p>css를 html에서 사용하는 방법은 크게 2가지로 나뉘어진다.</p>
    <p>1. head에 &lt;style&gt;태그를 사용하여 직접 css삽입</p>
    <p>2. head에 &lt;link rel="stylesheet" href="./03Style.css"&gt; 태그처럼 삽입하고, 해당 파일 편집</p>
</body>
</html>
