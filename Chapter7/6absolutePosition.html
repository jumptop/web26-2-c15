<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .stage {
            position: relative;
            width: 500px;
            height: 300px;
            border: 1px solid black;
        }

        .circle {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        #red {
            background-color: red;
            left: 20px;
            top: 20px;
        }

        #green {
            background-color: green;
            right: 20px;
            top: 20px;
        }

        #blue {
            background-color: blue;
            right: 20px;
            bottom: 20px;
        }

        #yellow {
            background-color: yellow;
            left: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>
    <p>ch7_2 요소 배치...절대위치 사용, 중앙에 배치, 고정 위젯에 배치</p>
    <h3>ch7_2_1 절대위치 사용</h3>
    <h4>반드시 기억, 자손의 position속성에 absolute를 적용하면 부모의 position 속성에 relative를 적용한다.</h4>
    <div class="stage">
        <div class="circle" id="red"></div>
        <div class="circle" id="green"></div>
        <div class="circle" id="blue"></div>
        <div class="circle" id="yellow"></div>
    </div>
</body>
</html>
